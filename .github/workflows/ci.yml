name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  pipeline:
    uses: MaksHofman/pipeline-templates/.github/workflows/python-app-pipeline.yml@v1
    with:
      image-name: ghcr.io/MaksHofman/streamforge-app
      push-image: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write